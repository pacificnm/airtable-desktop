# @see https://www.electron.build/configuration
appId: com.airtable.desktop
productName: Airtable Desktop
copyright: Copyright © 2026 Airtable
asar: true

directories:
  output: release
  buildResources: build

files:
  - '!**/*'
  - dist/**/*
  - dist-electron/**/*
  - package.json

npmRebuild: false

# Only ship compiled renderer + main; never bundle dev sources or node_modules.
extraMetadata:
  main: dist-electron/main.js

mac:
  category: public.app-category.productivity
  # ZIP builds on Linux/macOS. DMG needs macOS + optional `dmg-license` — use `npm run dist:mac:dmg`.
  target:
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - AppImage
  category: Office

# -----------------------------------------------------------------------------
# Publish (optional — enable when shipping releases)
# @see docs/electron-builder-publish.md
# -----------------------------------------------------------------------------
# publish:
#   provider: github
#   owner: your-org
#   repo: your-repo
#   releaseType: release
#
# CI: set GH_TOKEN (or GITHUB_TOKEN in Actions) and run:
#   npm run dist -- --publish always
#
# macOS notarization / Windows code signing use CSC_* and APPLE_* env vars — see the doc above.
